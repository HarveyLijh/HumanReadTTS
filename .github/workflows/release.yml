name: Release

# Fires on semver tag push (e.g. `git tag v0.8.0 && git push --tags`).
# Builds a Release .dmg via Scripts/package.sh, optionally signs +
# notarises (when the corresponding secrets are present), and
# publishes a GitHub Release with the DMG + checksum attached.
#
# Also runs via the Actions "Run workflow" button against an
# arbitrary ref — useful for cutting a pre-release smoke-test build
# before tagging.
#
# Workflow inputs and secrets are never interpolated directly into
# run: scripts — all variable data flows through env: blocks to
# avoid shell-injection risks (per GitHub Actions security guide).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to build (defaults to HEAD)"
        required: false
        default: ""

permissions:
  contents: write  # needed to publish the GitHub Release

jobs:
  build-dmg:
    name: Build + package (macOS arm64)
    # macos-15 (or newer) is required because some Swift package
    # dependencies (e.g. MLXUtilsLibrary) ship with swift-tools-version
    # 6.2, which only resolves under Xcode 26+.
    runs-on: macos-15
    timeout-minutes: 45

    # `secrets` context isn't allowed inside step-level `if:` expressions,
    # so we lift the existence check up to job-level env (where it is
    # allowed) and gate signing steps on the resulting string.
    env:
      HAS_SIGNING_CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Select Xcode (latest stable, Swift 6.2+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      # ReadAloudTTS ships a Local.xcconfig example. The hand-maintained
      # .xcodeproj references Configs/Local.xcconfig, so CI needs a
      # concrete copy (with DEVELOPMENT_TEAM left blank when we're
      # not signing — the unsigned path in package.sh is fine).
      - name: Seed Local.xcconfig
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -f Configs/Local.xcconfig.example ]; then
            cp Configs/Local.xcconfig.example Configs/Local.xcconfig
            if [ -n "${APPLE_TEAM_ID:-}" ]; then
              printf '\nDEVELOPMENT_TEAM = %s\n' "$APPLE_TEAM_ID" >> Configs/Local.xcconfig
            fi
          fi

      - name: Cache SwiftPM derived data
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', 'ReadAloudTTS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Import the Developer ID signing cert into a temporary
      # keychain. This step is a no-op when BUILD_CERTIFICATE_BASE64
      # isn't set — the package script will fall back to the
      # ad-hoc-signed DMG path and the release still goes out.
      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Package (sign + notarise if secrets present)
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x Scripts/package.sh
          if [ -n "${NOTARY_APPLE_ID:-}" ] && [ -n "${NOTARY_PASSWORD:-}" ] && [ -n "${DEVELOPER_ID_APPLICATION:-}" ]; then
            Scripts/package.sh --notarize --clean
          else
            echo "Signing secrets not configured — producing an unsigned DMG."
            Scripts/package.sh --clean
          fi

      - name: Compute SHA-256 checksum
        id: hash
        run: |
          set -euo pipefail
          DMG=$(ls dist/*.dmg | head -n 1)
          [ -n "$DMG" ] || { echo "No DMG produced in dist/"; exit 1; }
          HASH=$(shasum -a 256 "$DMG" | awk '{print $1}')
          DMG_NAME=$(basename "$DMG")
          shasum -a 256 "$DMG" > "${DMG}.sha256"

          {
            echo "dmg_path=$DMG"
            echo "dmg_name=$DMG_NAME"
            echo "sha256=$HASH"
          } >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact (for workflow_dispatch builds)
        uses: actions/upload-artifact@v5
        with:
          name: readaloudtts-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.sha256

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
          DMG_NAME: ${{ steps.hash.outputs.dmg_name }}
          DMG_SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")
          {
            printf '## What'\''s in %s\n\n' "$TAG_NAME"
            if [ -n "$PREV" ]; then
              git log --pretty="- %s (%h)" "${PREV}..${TAG_NAME}"
            else
              git log --pretty="- %s (%h)" --max-count=25 "${TAG_NAME}"
            fi
            printf '\n## Install\n\n'
            printf '1. Download `%s` below, mount, drag ReadAloudTTS into **/Applications**.\n' "$DMG_NAME"
            printf '2. **First launch:** right-click ReadAloudTTS.app → **Open** (Gatekeeper asks once).\n'
            printf '   Or strip the quarantine flag:\n\n'
            printf '   ```sh\n'
            printf '   xattr -dr com.apple.quarantine /Applications/ReadAloudTTS.app\n'
            printf '   ```\n\n'
            printf '## Checksum\n\n'
            printf '```\n%s  %s\n```\n' "$DMG_SHA256" "$DMG_NAME"
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.hash.outputs.dmg_path }}
            ${{ steps.hash.outputs.dmg_path }}.sha256
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: "ReadAloudTTS ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keychain
        if: ${{ always() && env.HAS_SIGNING_CERT == 'true' }}
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
